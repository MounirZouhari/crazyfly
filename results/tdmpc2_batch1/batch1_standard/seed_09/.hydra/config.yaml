seed: 9
max_steps: 50000
buffer_size: 50000
seed_steps: 2500
seed_updates: 2500
save_interval_steps: 2000
log_interval_steps: 500
eval_interval_steps: 5000
eval_flights: 3
eval_flight_steps: 500
env:
  backend: gymnasium
  env_id: CrazyflieHover-v0
  num_envs: 1
  utd_ratio: 1.0
  asynchronous: false
encoder:
  encoder_dim: 256
  num_encoder_layers: 2
  learning_rate: 9.0e-05
  tabulate: false
world_model:
  latent_dim: 512
  value_dropout: 0.01
  num_value_nets: 5
  num_bins: 101
  symlog_min: -10
  symlog_max: 10
  simnorm_dim: 8
  learning_rate: 0.0003
  predict_continues: false
  dtype: float32
  max_grad_norm: 20
  tabulate: false
tdmpc2:
  horizon: 3
  mppi_iterations: 6
  population_size: 512
  policy_prior_samples: 24
  num_elites: 64
  min_plan_std: 0.05
  max_plan_std: 2
  temperature: 0.5
  batch_size: 256
  discount: 0.99
  rho: 0.5
  consistency_loss_scale: 20
  reward_loss_scale: 0.1
  value_loss_scale: 0.1
  continue_loss_scale: 0.0
  entropy_coef: 0.0001
  tau: 0.01
